info:
  title: iBoxen WebLockerAPI
  description: Restful endpoints for integrating iBoxen WebLocker
  version: 1.0.0
paths:
  /v1/parcel/{parcelId}/compartment/statuses:
    get:
      summary: Retreive open compartments on this parcel's location
      # description: Retrive sense data from all ports on a location
      parameters:
        - name: deviceId
          schema:
            type: string
            required: true
            description: Name of IoT Device
          in: path
        - name: x-consumer
          schema:
            type: string
            required: true
          in: header
      responses:
        "200":
          content:
            application/json:
              example:
                - isOpen: true
                - isOpen: false
        "503":
          description: Device offline
      tags:
        - Parcel compartment interactions
      security:
        - ApiKeyAuth: []
  /v1/parcel/{parcelId}/compartment/status:
    get:
      summary: Retreive open compartment for this particular parcel
      # description: Retrive sense data from all ports on a device
      parameters:
        - name: deviceId
          schema:
            type: string
            required: true
            description: Name of IoT Device
          in: path
        - name: x-consumer
          schema:
            type: string
            required: true
          in: header
      responses:
        "200":
          content:
            application/json:
              example:
                - isOpen: true
                - isOpen: false
        "503":
          description: Device offline
      tags:
        - Parcel compartment interactions
      security:
        - ApiKeyAuth: []
