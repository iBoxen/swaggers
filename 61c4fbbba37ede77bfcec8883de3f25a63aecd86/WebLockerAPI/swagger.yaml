  /v1/locations/{locationId}/health: 
    get:
      summary: Check location health, including battery and connectivity
      # description: Retrieve battery status from device
      parameters:
        - name: deviceId
          schema:
            type: string
            required: true
            description: Name of IoT Device
          in: path
        - name: x-consumer
          schema:
            type: string
            required: true
          in: header
      responses:
        "200":
          content:
            application/json:
              example:
                status: Charging
        "503":
          description: Device offline
      tags:
        - Location status
      security:
