info:
  title: iBoxen WebLockerAPI
  description: Restful endpoints for integrating iBoxen WebLocker
  version: 1.0.0

paths:
  /v1/user/missions:
    get:
      summary: getMissions(locationId | coordinates, user?) 
      parameters:
        - name: locationId
          in: query
          type: string
          # required: true
          description: Location ID registered with iBoxen
        - name: coordinates
          in: query
          type: string
          # required: true
          description: Latitude,Longitude
        - name: user
          in: query
          type: string
          # required: true
          description: User ID
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcels:
                    type: array
                    items:
                      type: object
                      properties:
                        parcelId:
                          type: string
                        status:
                          type: string
                        boxId:
                          type: string
                        locker:
                          type: string
                  pickups:
                    type: array
                    items:
                      type: object
                      properties:
                        parcelId:
                          type: string
                        status:
                          type: string
                        boxId:
                          type: string
                        locker:
                          type: string
              example:
                parcels:
                  - parcelId: parcel-001
                    status: in-box
                    boxId: 6800e90ac1a98cc125bb79c6
                    locker: 13
                pickups:
                  - parcelId: pickup-001
                    status: picked-up
                    boxId: 6800e90ac1a98cc125bb79c7
                    locker: 14
        "503":
          description: Device offline
      tags:
        - Driver / Consumer -endpoints
      security:
        - ApiKeyAuth: []
  /v1/user/parcel:
    get:
      summary: getParcel(parcelId, locationId | coordinates, user?)
      parameters:
        - name: parcelId
          in: query
          type: string
          required: true
          description: Parcel ID registered with iBoxen
        - name: coordinates
          in: query
          type: string
          required: true
          description: Latitude,Longitude
        - name: user
          in: query
          type: string
          # required: true
          description: User ID
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcelId:
                    type: string
                  status:
                    type: string
                  boxId:
                    type: string
                  locker:
                    type: string
              example:
                parcelId: parcel-001
                status: on-way
                boxId: 6800e90ac1a98cc125bb79c6
                locker: 13
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
        "503":
          description: Device offline
      tags:
        - Driver / Consumer -endpoints
      security:
        - ApiKeyAuth: []

  /v1/user/compartment/sense:
    get:
      summary: senseParcelCompartment(parcelId, locationId | coordinates, user?)
      parameters:
        - name: body
          requestBody:
            description: request body
            required: true
            schema:
              type: object
              properties:
                parcelId:
                  type: string
                  description: Parcel ID registered with iBoxen
                user:
                  type: string
                  description: User ID (optional)
                locationId:
                  type: string
                  description: Location ID (optional)
                coordinates:
                  type: string
                  description: Latitude,Longitude (optional)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  openLockers:
                    type: array
                    items:
                      type: number
              example:
                openLockers: [1,2,3]
          description: Open lockers
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
        "503":
          description: Device offline
      tags:
        - Driver / Consumer -endpoints
      


  /v1/user/compartment/open:
    post:
      summary: openParcelCompartment(parcelId, locationId | coordinates, user?)
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId:
                type: string
                description: Parcel ID registered with iBoxen
              user:
                type: string
                description: User ID (optional)
              locationId:
                type: string
                description: Location ID (optional)
              coordinates:
                type: string
                description: Latitude,Longitude (optional)
      responses:
        "204":
          description: Locker opened
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
        "503":
          description: Device offline
      tags:
        - Driver / Consumer -endpoints

  /v1/user/parcel/status:
    post:
      summary: setParcelStatus(parcelId, status, user?)
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId:
                type: string
                description: Parcel ID registered with iBoxen
              status:
                type: string
                description: Status of the parcel (e.g., "delivered", "picked up")
              user:
                type: string
                description: User ID (optional)
      responses:
        "204":
          description: Parcel status updated
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
      tags:
        - Driver / Consumer -endpoints

  /v1/user/compartment/change:
    post:
      summary: changeCompartment(parcelId, size?; larger | smaller | same, user?)
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId:
                type: string
                description: Parcel ID registered with iBoxen
              size:
                type: string
                description: Size of the compartment (e.g., "larger", "smaller", "same")
              user:
                type: string
                description: User ID (optional)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  compartment:
                    type: string
              example:
                compartment: string
          description: Compartment changed
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: No available compartment
        "500":
          description: Internal server error
        "503":
          description: Device offline
      tags:
        - Driver / Consumer -endpoints


  /v1/user/report-hardware:
    post:
      summary: reportHardware(parcelId, status, user?)
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId:
                type: string
                description: Parcel ID registered with iBoxen
                example: parcel-001
              deviation:
                $ref: '#/components/schemas/HardwareDeviation'
                description: Hardware deviation
                examples:
                  DoorDidNotOpen:
                    value:
                      type: DoorDidNotOpen
                      timestamp: 2025-04-01T09:00:00.000Z
                      message: Door did not open
                  DoorDidNotClose:
                    value:
                      type: DoorDidNotClose
                      timestamp: 2025-04-01T09:01:00.000Z
                      message: Door did not close
              user:
                type: string
                description: User ID (optional)
              
      responses:
        "204":
          description: Report received
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Location not found
        "500":
          description: Internal server error
      tags:
        - Driver / Consumer -endpoints
  /v1/user/report-allocation:
    post:
      summary: reportAllocation(parcelId, status, user?)
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId:
                type: string
                description: Parcel ID registered with iBoxen
              deviation:
                $ref: '#/components/schemas/AllocationDeviation'
                description: Allocation deviation
                examples:
                  OtherParcelInLocker:
                    value:
                      type: OtherParcelInLocker
                      timestamp: 2025-04-01T09:00:00.000Z
                      message: Other parcel in locker
                  ParcelTooLarge:
                    value:
                      type: ParcelTooLarge
                      timestamp: 2025-04-01T09:01:00.000Z
                      message: Parcel too large
              user:
                type: string
                description: User ID (optional)
      responses:
        "204":
          description: Report received
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Parcel not found
        "500":
          description: Internal server error
      tags:
        - Driver / Consumer -endpoints


  /v1/user/location/report:
    post:
      summary: reportLocation(locationId | coordinates, report, user?) 
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              locationId:
                type: string
                description: Location ID registered with iBoxen
              report:
                type: string
                description: Report of the location (e.g., "damaged", "missing")
              user:
                type: string
                description: User ID (optional)
      responses:
        "204":
          description: Report received
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Location not found
        "500":
          description: Internal server error
      tags:
        - Driver / Consumer -endpoints

  /v1/user/latest-parcel:
    get:
      summary: getLatestParcel(locationId | coordinates, user?)
      parameters:
        - name: locationId
          in: query
          type: string
          # required: true
          description: Location ID registered with iBoxen
        - name: coordinates
          in: query
          type: string
          # required: true
          description: Latitude,Longitude
        - name: user
          in: query
          type: string
          # required: true
          description: User ID
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcelId: string
                  status: string
                  boxId: string
                  locker: string
                  logs: 
                    type: array
                    items:
                      type: object
                      properties:
                        type: string
                        timestamp: string
                        message: string
              example:
                parcelId: parcel-001
                status: on-way
                boxId: 6800e90ac1a98cc125bb79c6
                locker: 13
                logs: 
                  - type: info
                    timestamp: 2025-04-01T09:00:00.000Z
                    message: Parcel scanned by driver ( driver-001 )
                  - type: error
                    timestamp: 2025-04-01T09:01:00.000Z
                    message: Parcel scanned in the wrong location. Scanned in location-001, allocated to location-002
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "500":
          description: Internal server error
        "503":
          description: Device offline
      tags:
        - Driver -endpoints
  /health:
    get:
      summary: Health check for this API
      description: ""
      parameters: []
      responses:
        "200":
          content:
            application/json:
              example:
                status: healthy
      tags:
        - Health
      security:
        - ApiKeyAuth: []
tags: []
openapi: 3.0.1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:

    # -------- individual variants --------
    DoorDidNotOpen:
      type: object
      required: [type, timestamp]          
      properties:
        type:         { type: string, enum: [DoorDidNotOpen] }
        timestamp:    { type: string, format: date-time }
        message:      { type: string }

    DoorDidNotClose:
      type: object
      required: [type, timestamp]          
      properties:
        type:         { type: string, enum: [DoorDidNotClose] }
        timestamp:    { type: string, format: date-time }
        message:      { type: string }

    OtherParcelInLocker:
      type: object
      required: [type, timestamp, message]
      properties:
        type:         { type: string, enum: [OtherParcelInLocker] }
        timestamp:    { type: string, format: date-time }
        message:      { type: string }

    ParcelTooLarge:
      type: object
      required: [type, timestamp]
      properties:
        type:         { type: string, enum: [ParcelTooLarge] }
        timestamp:    { type: string, format: date-time }
        message:      { type: string }

    HardwareDeviation:                               
      oneOf:
        - $ref: '#/components/schemas/DoorDidNotOpen'
        - $ref: '#/components/schemas/DoorDidNotClose'
      discriminator:                            # ✓ OpenAPI-3.0 feature
        propertyName: type
        mapping:
          DoorDidNotOpen:      '#/components/schemas/DoorDidNotOpen'
          DoorDidNotClose:     '#/components/schemas/DoorDidNotClose'

    AllocationDeviation:
      oneOf:
        - $ref: '#/components/schemas/OtherParcelInLocker'
        - $ref: '#/components/schemas/ParcelTooLarge'
      discriminator:                            # ✓ OpenAPI-3.0 feature
        propertyName: type
        mapping:
          OtherParcelInLocker: '#/components/schemas/OtherParcelInLocker'