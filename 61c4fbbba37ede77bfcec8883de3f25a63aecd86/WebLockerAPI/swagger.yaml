openapi: 3.0.3

info:
  title: iBoxen WebLocker API
  description: REST end-points for integrating the iBoxen WebLocker.
  version: 1.0.0

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization

  schemas:
    # ────────────────────────── deviation variants ──────────────────────────
    DoorDidNotOpen:
      type: object
      required: [type, timestamp]
      properties:
        type:        { type: string, enum: [DoorDidNotOpen] }
        timestamp:   { type: string, format: date-time }
        message:     { type: string }

    DoorDidNotClose:
      type: object
      required: [type, timestamp]
      properties:
        type:        { type: string, enum: [DoorDidNotClose] }
        timestamp:   { type: string, format: date-time }
        message:     { type: string }

    OtherParcelInLocker:
      type: object
      required: [type, timestamp, message]
      properties:
        type:        { type: string, enum: [OtherParcelInLocker] }
        timestamp:   { type: string, format: date-time }
        message:     { type: string }

    ParcelTooLarge:
      type: object
      required: [type, timestamp]
      properties:
        type:        { type: string, enum: [ParcelTooLarge] }
        timestamp:   { type: string, format: date-time }
        message:     { type: string }

    HardwareDeviation:
      oneOf:
        - $ref: '#/components/schemas/DoorDidNotOpen'
        - $ref: '#/components/schemas/DoorDidNotClose'
      discriminator:
        propertyName: type
        mapping:
          DoorDidNotOpen:  '#/components/schemas/DoorDidNotOpen'
          DoorDidNotClose: '#/components/schemas/DoorDidNotClose'

    AllocationDeviation:
      oneOf:
        - $ref: '#/components/schemas/OtherParcelInLocker'
        - $ref: '#/components/schemas/ParcelTooLarge'
      discriminator:
        propertyName: type
        mapping:
          OtherParcelInLocker: '#/components/schemas/OtherParcelInLocker'
          ParcelTooLarge:      '#/components/schemas/ParcelTooLarge'

    MissionItem:
      type: object
      required: [parcelId, status, boxId, locker]
      properties:
        parcelId: { type: string }
        status:   { type: string }
        boxId:    { type: string }
        locker:   { type: string }

    MissionResponse:
      type: object
      properties:
        parcels:
          type: array
          items: { $ref: '#/components/schemas/MissionItem' }
        pickups:
          type: array
          items: { $ref: '#/components/schemas/MissionItem' }

    ParcelResponse:
      type: object
      required: [parcelId, status, boxId, locker]
      properties:
        parcelId: { type: string }
        status:   { type: string }
        boxId:    { type: string }
        locker:   { type: string }

    LatestParcelLog:
      type: object
      required: [type, timestamp, message]
      properties:
        type:      { type: string }
        timestamp: { type: string, format: date-time }
        message:   { type: string }

    LatestParcelResponse:
      allOf:
        - $ref: '#/components/schemas/ParcelResponse'
        - type: object
          properties:
            logs:
              type: array
              items: { $ref: '#/components/schemas/LatestParcelLog' }

paths:
  /v1/user/missions:
    get:
      summary: getMissions (locationId \| coordinates, user?)
      parameters:
        - name: locationId
          in: query
          description: Location ID registered with iBoxen
          schema: { type: string }
        - name: coordinates
          in: query
          description: Latitude,Longitude
          schema: { type: string }
        - name: user
          in: query
          description: User ID
          schema: { type: string }
      responses:
        '200':
          description: Missions found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionResponse' }
              examples:
                default:
                  summary: Sample missions
                  value:
                    parcels:
                      - parcelId: parcel-001
                        status:   in-box
                        boxId:    6800e90ac1a98cc125bb79c6
                        locker:   '13'
                    pickups:
                      - parcelId: pickup-001
                        status:   picked-up
                        boxId:    6800e90ac1a98cc125bb79c7
                        locker:   '14'
        '503': { description: Device offline }
      tags: [Driver / Consumer -endpoints]
      security: [{ ApiKeyAuth: [] }]

  /v1/user/parcel:
    get:
      summary: getParcel (parcelId, locationId \| coordinates, user?)
      parameters:
        - name: parcelId
          in: query
          required: true
          description: Parcel ID registered with iBoxen
          schema: { type: string }
        - name: coordinates
          in: query
          description: Latitude,Longitude
          schema: { type: string }
        - name: user
          in: query
          description: User ID
          schema: { type: string }
      responses:
        '200':
          description: Parcel found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelResponse' }
              examples:
                default:
                  summary: Sample parcel
                  value:
                    parcelId:
