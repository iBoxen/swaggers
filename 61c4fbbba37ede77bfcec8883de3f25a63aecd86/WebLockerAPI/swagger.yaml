  /v1/parcel/{parcelId}/compartment/open:
    post:
      summary: Open compartment
      description: Open port on device
      parameters:
        - name: deviceId
          schema:
            type: string
            required: true
            description: Name of IoT Device
          in: path
        - name: portId
          schema:
            type: number
            required: true
            description: Index of port
          in: path
        - name: openDuration
          schema:
            type: number
          in: query
        - name: x-consumer
          schema:
            type: string
            required: true
          in: header
        - name: data
          description: request body
          schema:
            type: object
            properties: {}
          in: body
      responses:
        "200": {}
        "503":
          description: Device offline
      tags:
        - Parcel compartment interactions
      security:
        - ApiKeyAuth: []

  /v1/parcel/{parcelId}/compartment/new:
    post:
      summary: Request new parcel compartment
      description: Open port on device
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId: 
                type: string
                description: Parcel ID
              compartmentType:
                type: string
                description: Larger,smaller,another
      responses:
        "200": {}
        "400":
          description: Parcel ID not found
        "503":
          description: Device offline
      tags:
        - Parcel compartment interactions
      security:
        - ApiKeyAuth: []

  /v1/parcel/{parcelId}/compartment/report:
    post:
      summary: Report issue with current parcel compartment, get a new one
      description: Open port on device
      parameters:
        - name: body
          in: body
          description: request body
          required: true
          schema:
            type: object
            properties:
              parcelId: 
                type: string
                description: Parcel ID
              issueCode:
                type: string
                description: CompartmentDidNotOpen, CompartmentDidNotClose, AnotherParcelInCompartment
      responses:
        "200": {}
        "400":
          description: Parcel ID not found
        "503":
          description: Device offline
      tags:
        - Parcel compartment interactions
      security:
        - ApiKeyAuth: []
